site_name: Openterface Docs
site_url: https://docs.openterface.com/
site_author: Openterface
site_description: Official documentation for Openterface KVM-over-USB products and software
repo_name: openterface_docs
repo_url: https://github.com/TechxArtisanStudio/openterface_docs
edit_uri: edit/main/docs/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/images/app-logo.png
  favicon: https://assets.openterface.com/images/favicon.png
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
  features:
    - toc.follow
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs
    - content.code.annotation
    - content.code.copy
    - content.tabs.link
    - announce.dismiss
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  qt_version: "0.5.23"
  android_version: "1.2.2"
  macos_version: "2.1"
  qt_linux_stable: "0.3.19"
  copyright_year: 2026
  homepage: /
  ecosystem:
    news: https://news.openterface.com/
    shop: https://shop.techxartisan.com/
    forum: https://forum.openterface.com/
    marketing_en: https://en.openterface.com/
  analytics:
    provider: google
    property: G-EKZEH6QYWT
  consent:
    title: Cookie Consent
    description: We use cookies to enhance quality of docs content, analyse site effectiveness and needs. By consenting, you help us improve our website. Thanks!
    actions:
      - accept
      - reject

markdown_extensions:
  - tables
  - def_list
  - admonition
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.betterem
  - pymdownx.snippets:
      base_path: docs
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      pygments_lang_class: true
      auto_title: true
      linenums: true
      linenums_style: pymdownx-inline
      anchor_linenums: true
      line_spans: __span
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - toc:
      toc_depth: 2

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      use_directory_urls: true
      languages:
        - locale: en
          name: English
          build: true
          site_name: Openterface Docs
          default: true
  - glightbox:
      skip_classes:
        - skip-lightbox
  - search
  - macros
  - tags
  - meta
  - social

