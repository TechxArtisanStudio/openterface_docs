name: Link check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly catch for external links that go stale over time.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build

      - name: Run link & image 404 checker
        run: npm run check:links
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-link-check-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
